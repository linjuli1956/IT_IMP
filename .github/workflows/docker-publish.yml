name: 发布 Docker Hub 镜像

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成中国时区日期标签
        id: date
        run: echo "tag=$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送 amd64 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            linjuli2026/it-imp-web:latest
            linjuli2026/it-imp-web:${{ steps.date.outputs.tag }}

      - name: 同步 Docker Hub 仓库说明
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          auth_payload="$(jq -nc --arg identifier "$DOCKERHUB_USERNAME" --arg secret "$DOCKERHUB_TOKEN" '{identifier: $identifier, secret: $secret}')"
          access_token="$(curl --fail --silent --show-error --request POST \
            --header 'Content-Type: application/json' \
            --data "$auth_payload" \
            https://hub.docker.com/v2/auth/token | jq -er '.access_token')"

          description='IT_IMP 综合管理平台：Docker Compose 一键部署，无需源码或本地构建。'
          repository_payload="$(jq -nc --arg description "$description" '{description: $description}')"
          curl --fail --silent --show-error --request PATCH \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Type: application/json' \
            --data "$repository_payload" \
            "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/it-imp-web/"
