name: 发布 Docker Hub 镜像

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'

      # 发布门禁：登录 Docker Hub 之前必须全部通过，任一失败即中止，不登录、不推送
      - name: 发布门禁（npm ci/prisma/typecheck/test/build/go test）
        env:
          DATABASE_URL: "mysql://root:placeholder@localhost:3306/it_imp"
        run: |
          set -euo pipefail
          cd web
          npm ci
          npx prisma generate
          npm run typecheck
          npm test -- --run
          npm run build
          cd ../desktop
          go test ./...
          cd ..
          echo "发布门禁全部通过"

      - name: 读取根目录 VERSION 作为镜像标签（校验 YYYYMMDD 格式）
        id: version
        run: |
          set -euo pipefail
          tag=$(tr -d '[:space:]' < VERSION)
          if ! echo "$tag" | grep -Eq '^(19|20)[0-9]{2}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01])$'; then
            echo "VERSION 格式非法：$tag（应为 YYYYMMDD）" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送 amd64 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            linjuli2026/it-imp-web:latest
            linjuli2026/it-imp-web:${{ steps.version.outputs.tag }}
