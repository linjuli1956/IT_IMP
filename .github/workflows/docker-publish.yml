name: 发布 Docker Hub 镜像

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'

      # 发布门禁：登录 Docker Hub 之前必须全部通过，任一失败即中止，不登录、不推送
      - name: 发布门禁（npm ci/prisma/typecheck/test/build/go test）
        env:
          DATABASE_URL: "mysql://root:placeholder@localhost:3306/it_imp"
        run: |
          set -euo pipefail
          cd web
          npm ci
          npx prisma generate
          npm run typecheck
          npm test -- --run
          npm run build
          cd ../desktop
          go test ./...
          cd ..
          echo "发布门禁全部通过"

      - name: 生成中国时区日期标签
        id: date
        run: echo "tag=$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送 amd64 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            linjuli2026/it-imp-web:latest
            linjuli2026/it-imp-web:${{ steps.date.outputs.tag }}
