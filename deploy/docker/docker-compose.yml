# IT_IMP Docker Compose
#
# 本文件位于主项目中，构建时直接使用 ../../web，避免维护源码副本。
# 使用前请先复制 .env.docker.example 为 .env.docker。

services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    image: ${IT_IMP_IMAGE:-it-imp-web:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./data/app:/app/data
