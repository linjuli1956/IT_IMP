# 涓嶉渶瑕?.env銆佷笉闇€瑕佷笅杞芥簮鐮併€佷笉闇€瑕佸湪 NAS 鏋勫缓闀滃儚銆?
# 鏈枃浠跺彲鐩存帴浣滀负 GitHub 閮ㄧ讲绀轰緥锛氭瘡椤归厤缃兘闄勬湁鐢ㄩ€斻€佺ず渚嬫垨淇敼鎻愮ず銆?
#
# 鏈嶅姟璇存槑锛?
#   - config-check锛氫竴娆℃€ф鏌ュ繀濉瘑閽ワ紝鎴愬姛鍚庢樉绀?Exited 0 灞炴甯哥幇璞°€?
#   - db锛歁ySQL 鏁版嵁搴擄紝瀹瑰櫒鍐呴儴绔彛鍥哄畾涓?3306銆?
#   - web锛氱鐞嗗钩鍙帮紝瀹瑰櫒鍐呴儴绔彛鍥哄畾涓?3000銆?
#
# 鍥哄畾鏃ユ湡鐗堟湰锛氬皢 web.image 鐨?latest 鏀逛负渚嬪 20260810銆?

x-it-imp-settings:
  # ======== 蹇呴』淇敼锛氭崲鎴愪綘鑷繁鐨勫己瀵嗙爜锛屼笉鑳界洿鎺ヤ娇鐢ㄤ腑鏂囧崰浣嶅€兼垨绀轰緥鍊?========
  # 瀵嗙爜鍖呭惈 $ 鏃讹紝Compose 涓』鍐欐垚 $$锛涗緥濡?A$B 搴斿啓涓?A$$B銆?
  mysql-root-password: &mysql-root-password "浣犵殑MySQL寮哄瘑鐮? # 渚嬪: MySql@2026#Secure锛汳ySQL root 鐧诲綍瀵嗙爜
  jwt-secret: &jwt-secret "浣犵殑JWT寮哄瘑閽? # 渚嬪: JwtSecret@2026#IT_IMP锛涚敤浜庣櫥褰曚护鐗岀鍚?
  initial-admin-username: &initial-admin-username "admin" # 棣栨绠＄悊鍛樿处鍙凤紝鍙寜闇€淇敼
  initial-admin-password: &initial-admin-password "浣犵殑绠＄悊鍛樺瘑鐮? # 渚嬪: Admin@2026#Secure锛涢娆＄櫥褰曞悗璇风珛鍗充慨鏀?

  # ======== 骞冲彴鏄剧ず涓庢椂鍖?========
  app-name: &app-name "缁煎悎绠＄悊骞冲彴" # 娴忚鍣ㄩ〉闈㈡樉绀虹殑绯荤粺鍚嶇О锛屼緥濡傦細娉板叴瓒呭競淇℃伅閮ㄧ患鍚堢鐞嗗钩鍙?
  timezone: &timezone "Asia/Shanghai" # 鏃跺尯锛屼緥濡傦細Asia/Shanghai
  mysql-command: &mysql-command "--default-time-zone=+08:00" # MySQL 浣跨敤涓滃叓鍖?

  # ======== NAS 瀵瑰绔彛锛氬乏杈规槸 NAS/灞€鍩熺綉绔彛锛屼笉鏄鍣ㄥ唴閮ㄧ鍙?========
  web-port: &web-port "31956"     # 娴忚鍣ㄨ闂細http://NAS_IP:31956锛涘彲鏀逛负鏈崰鐢ㄧ鍙?
  mysql-port: &mysql-port "3307"  # DBX 绛夊閮ㄥ伐鍏疯繛鎺ワ細NAS_IP:3307锛涘彲鏀逛负鏈崰鐢ㄧ鍙?

  # ======== 鏁版嵁鎸佷箙鍖栫洰褰曪細璇锋寜 NAS 瀹為檯鐩綍淇敼 ========
  # 鐩稿璺緞鍙啓 ./data/mysql 涓?./data/app锛汵AS 鎺ㄨ崘浣跨敤缁濆璺緞銆?
  # MySQL 鏁版嵁搴撴枃浠朵綅浜?mysql 鐩綍锛涚敤鎴蜂笂浼犵殑 PDF 绛夊簲鐢ㄦ枃浠朵綅浜?app 鐩綍銆?
  mysql-data-dir: &mysql-data-dir "./data/mysql" # 绀轰緥锛?vol1/1000/docker/IT_IMP_docker/data/mysql
  app-data-dir: &app-data-dir "./data/app" # 绀轰緥锛?vol1/1000/docker/IT_IMP_docker/data/app

services:
  # 鍚姩鍓嶉樆姝㈠叕寮€鍗犱綅瀵嗛挜璇敤浜庣湡瀹炴暟鎹簱锛涙垚鍔熼€€鍑猴紙Exited 0锛夎〃绀烘鏌ラ€氳繃銆?
  config-check:
    image: busybox:1.36
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: *mysql-root-password
      JWT_SECRET: *jwt-secret
      INITIAL_ADMIN_PASSWORD: *initial-admin-password
    command:
      - /bin/sh
      - -ec
      - |
        for name in MYSQL_ROOT_PASSWORD JWT_SECRET INITIAL_ADMIN_PASSWORD; do
          value="$$(printenv "$$name")"
          case "$$value" in
            ""|CHANGE_ME_*|"浣犵殑MySQL寮哄瘑鐮?|"浣犵殑JWT寮哄瘑閽?|"浣犵殑绠＄悊鍛樺瘑鐮?)
              echo "閰嶇疆閿欒锛氳鍦?docker-compose.yml 椤堕儴璁剧疆 $$name"
              exit 1
              ;;
          esac
        done
        echo "閮ㄧ讲閰嶇疆妫€鏌ラ€氳繃銆?

  db:
    image: mysql:8.0
    restart: unless-stopped
    depends_on:
      config-check:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: *mysql-root-password
      # 浠呭湪绌烘暟鎹洰褰曢娆″垵濮嬪寲鏃跺垱寤鸿繙绋?root 鏉冮檺锛涘凡鏈夋暟鎹簱涓嶄細鑷姩鏀瑰彉銆?
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: it_imp
      TZ: *timezone
    command: *mysql-command
    ports:
      # 澶栭儴 NAS_IP:3307 -> 瀹瑰櫒鍐呴儴 MySQL:3306
      - target: 3306
        published: *mysql-port
        host_ip: 0.0.0.0
        protocol: tcp
    volumes:
      - type: bind
        source: *mysql-data-dir
        target: /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    # 榛樿鑷姩璺熼殢鏈€鏂扮増锛涢渶瑕佸浐瀹氱増鏈椂鏀逛负 linjuli2026/it-imp-web:20260810銆?
    image: linjuli2026/it-imp-web:latest
    restart: unless-stopped
    depends_on:
      config-check:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      # 浠ヤ笅鏄?Docker 鍐呴儴杩炴帴锛氬繀椤讳繚鎸?db:3306锛屼笉瑕佹敼涓?NAS_IP:3307銆?
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_NAME: it_imp
      MYSQL_ROOT_PASSWORD: *mysql-root-password
      JWT_SECRET: *jwt-secret
      INITIAL_ADMIN_USERNAME: *initial-admin-username
      INITIAL_ADMIN_PASSWORD: *initial-admin-password
      NUXT_PUBLIC_APP_NAME: *app-name
      PORT: "3000"
      TZ: *timezone
    ports:
      # 澶栭儴 NAS_IP:31956 -> 瀹瑰櫒鍐呴儴 Web:3000
      - target: 3000
        published: *web-port
        host_ip: 0.0.0.0
        protocol: tcp
    volumes:
      - type: bind
        source: *app-data-dir
        target: /app/data
