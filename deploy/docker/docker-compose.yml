# IT_IMP Docker Compose
#
# 本文件位于主项目中，构建时直接使用 ../../web，避免维护源码副本。
# 使用前请先复制 .env.docker.example 为 .env.docker。

services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    image: ${IT_IMP_IMAGE:-it-imp-web:local}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      DATABASE_PASSWORD_FILE: /run/secrets/mysql_root_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    secrets:
      - mysql_root_password
      - jwt_secret
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./data/app:/app/data

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
