# 可选：为首次管理员密码启用 Docker Secret。
# 使用：docker compose -f docker-compose.yml -f docker-compose.secrets.yml --env-file .env.docker up -d --build
services:
  web:
    environment:
      INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/initial_admin_password
    secrets:
      - initial_admin_password

secrets:
  initial_admin_password:
    file: ./secrets/initial_admin_password.txt
